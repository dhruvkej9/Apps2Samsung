name: Build Test APK

# Fork-only: builds a signed APK of the current branch for trying on a phone.
# Differs from upstream test-apk.yml only in not pinning the release signer SHA256,
# since this key is a throwaway one made for testing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep -oE 'v[0-9]+(\.[0-9]+){1,3}' Apps2Samsung.Desktop/Helpers/AppSettings.cs)
          [ -z "$VERSION" ] && { echo "Version not found"; exit 1; }
          BRANCH=$(echo "${{ github.ref_name }}" | tr -c 'A-Za-z0-9.\n-' '-')
          echo "VERSION_NAME=${VERSION#v}-${BRANCH}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Prepare signing key
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$PWD/a2s.keystore"
          echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KS_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          dotnet publish Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj \
            -c Release -f net10.0-android \
            -p:ApplicationDisplayVersion="$VERSION_NAME" \
            -p:ApplicationVersion="1" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$PWD/a2s.keystore" \
            -p:AndroidSigningKeyAlias="$KS_ALIAS" \
            -p:AndroidSigningStorePass="$KS_PASS" \
            -p:AndroidSigningKeyPass="$KS_PASS" \
            -o publish/android
          mkdir -p dist
          APK=$(ls publish/android/*-Signed.apk 2>/dev/null | head -n1)
          [ -z "$APK" ] && APK=$(ls publish/android/*.apk 2>/dev/null | head -n1)
          [ -z "$APK" ] && { echo "No APK produced"; exit 1; }
          cp "$APK" "dist/Apps2Samsung-${VERSION_NAME}-test.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error
